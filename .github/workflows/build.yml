# Compila el overlay como .exe (Windows) y verifica que el DLL compile.
# Builds the overlay as an .exe (Windows) and checks that the DLL compiles.
#
# Olympian Planet Coords — Copyright © 2026 MightyZeus · GPL-3.0 License

name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay-exe:
    name: Overlay .exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Dependencias / dependencies
        run: python -m pip install --upgrade pip pyinstaller==6.22.3 pillow==13.0.0

      - name: Compilar / build
        run: pyinstaller --noconfirm --clean build_tools/overlay.spec

      - name: Hash SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/OlympianPlanetCoords-Overlay.exe -Algorithm SHA256).Hash.ToLower()
          "$h  OlympianPlanetCoords-Overlay.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
          (Get-Item dist/OlympianPlanetCoords-Overlay.exe).Length

      - uses: actions/upload-artifact@v7
        with:
          name: OlympianPlanetCoords-Overlay
          path: |
            dist/OlympianPlanetCoords-Overlay.exe
            dist/SHA256SUMS.txt
          retention-days: 30

  dll:
    name: DLL (mingw-w64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: mingw-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Compilar / build
        run: sh dll/build.sh

      - name: Importaciones / imports
        run: x86_64-w64-mingw32-objdump -p dll/build/winmm.dll | grep "DLL Name"
